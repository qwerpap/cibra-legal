<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Cibra</title>
<style>
:root{--bg:#FBF4E8;--ink:#2B211C;--soft:#6E5F55;--rule:#E5D3BC;--acc:#C9402A;--card:#FFFBF3}
@media (prefers-color-scheme:dark){:root{--bg:#1A1411;--ink:#F2E8DC;--soft:#B3A294;--rule:#3A2E27;--acc:#FF7A5E;--card:#231B17}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Figtree",-apple-system,"Segoe UI",sans-serif}
header{padding:34px 20px 8px;max-width:660px;margin:0 auto}
header .mark{font:700 15px/1 "Figtree",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1{font:400 38px/1.15 "Young Serif",Georgia,"Times New Roman",serif;margin:.35em 0 .1em}
.dated{color:var(--soft);font-size:14px;margin:0}
main{max-width:660px;margin:0 auto;padding:12px 20px 60px}
section{background:var(--card);border-left:4px solid var(--acc);border-radius:4px 16px 16px 4px;padding:6px 20px 12px;margin:18px 0;box-shadow:0 1px 0 var(--rule)}
h2{font:400 21px/1.3 "Young Serif",Georgia,serif;margin:.9em 0 .3em}
a{color:var(--acc)}
ul{padding-left:1.2em;margin:.4em 0}
li{margin:.25em 0}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{border-bottom:1px solid var(--rule);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--soft);font-weight:600}
nav.foot{max-width:660px;margin:0 auto;padding:0 20px 40px;color:var(--soft);font-size:14px}
nav.foot a{margin-right:14px}
.lead{font-size:19px}
</style></head><body>
<header><div class="mark">Cibra</div><h1>Food noise and GLP-1 journal</h1><p class="dated">A private pocket journal for protein, water, fiber, food noise and dose days.</p></header><main><section><h2>Pages</h2><ul><li><a href="privacy.html">Privacy policy</a></li><li><a href="terms.html">Terms of use</a></li><li><a href="support.html">Support</a></li></ul></section></main>
</body></html>
